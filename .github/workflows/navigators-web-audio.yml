name: Build Navigators WEB audio index
on:
  push:
    paths:
      - scripts/generate-navigators-audio-manifest.cjs
      - .github/workflows/navigators-web-audio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify chapter links from eBible
        run: node scripts/generate-navigators-audio-manifest.cjs
      - name: Commit generated verified chapter manifest
        run: |
          git add navigators-audio-manifest.js
          if git diff --cached --quiet; then
            echo "Audio manifest already current"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Generate verified eBible chapter audio manifest"
          git push
