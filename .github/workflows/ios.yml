# iOS app CI — builds and smoke-tests the Capacitor app WITHOUT any Apple
# signing credentials or paid membership. Nothing here deploys the website or
# touches production; GitHub Pages publishing is unaffected.
#
#   web  (Linux, cheap):  build the offline web bundle + offline smoke test
#   ios  (macOS):         compile for Simulator and for device (unsigned),
#                         install + launch in the iOS Simulator, screenshot
#
# Artifacts: smoke-test screenshots, Simulator screenshots, launch logs.
name: iOS app

on:
  pull_request:
  push:
    branches: [main, 'claude/**', 'feature/**']
    paths:
      - 'app/**'
      - '.github/workflows/ios.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'lang/**'
      - 'assets/**'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web bundle + offline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium (test only)
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm test
      - name: Growing Faith routes and design consistency
        run: node ../tests/growing-faith.test.mjs
      - name: Growing Faith desktop and mobile browser audit
        run: node tests/growing-faith-visual.mjs
      - name: Offline-first suite (airplane mode, sync safety, durable storage)
        run: node tests/offline-first.mjs
      - name: Navigation audit (every screen × 3 iPhone sizes)
        run: node tests/navigation-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-smoke-screenshots
          path: app/test-output/
          if-no-files-found: ignore

  ios:
    name: Xcode build + Simulator launch (unsigned)
    needs: web
    runs-on: macos-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Select newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tee build/sim.log | grep -E "error:|warning: .*Obey|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/sim/Build/Products/Debug-iphonesimulator/App.app

      - name: Build for iPhone hardware (Release, unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build/device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/device/Build/Products/Release-iphoneos/App.app

      - name: Install and launch in the iOS Simulator
        run: |
          mkdir -p sim-output
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          c = [(r, x) for r, l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          c.sort(key=lambda t: (t[0], t[1]['name']))
          print(c[-1][1]['udid'])")
          echo "Simulator: $(xcrun simctl list devices | grep $UDID)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/App.app
          # Wait for WebKit's first meaningful paint instead of a fixed sleep:
          # a cold CI simulator can take 20 s+ to paint even a local page.
          wait_for_paint() {   # $1 = label, $2 = seconds, $3 = log start time
            local start=$(date +%s)
            while [ $(( $(date +%s) - start )) -lt "$2" ]; do
              if xcrun simctl spawn "$UDID" log show --start "$3" --style compact \
                   --predicate 'process == "App" AND eventMessage CONTAINS "firstMeaningfulPaint"' 2>/dev/null \
                   | grep -o "firstMeaningfulPaint=[0-9.]*" | tail -1 > "sim-output/$1-paint.txt" && [ -s "sim-output/$1-paint.txt" ]; then
                echo "$1: $(cat sim-output/$1-paint.txt) s after load start (waited $(( $(date +%s) - start )) s)"
                return 0
              fi
              sleep 2
            done
            echo "::error::$1: no first paint within $2 s"; return 1
          }
          T0=$(date '+%Y-%m-%d %H:%M:%S')
          xcrun simctl launch "$UDID" tools.obey.app
          PAINTED=0; wait_for_paint cold 90 "$T0" && PAINTED=1
          sleep 2
          xcrun simctl io "$UDID" screenshot sim-output/01-home-cold.png
          # Fail if the app crashed or quit during startup.
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "tools.obey.app"; then
            echo "::error::App is not running after launch (crash on startup?)"
            xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "App"' > sim-output/app-cold.log || true
            exit 1
          fi
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "App"' > sim-output/app-cold.log || true
          if grep -E "Error loading page|fatalLoadError|Unable to load|JS Eval error" sim-output/app-cold.log; then
            echo "::warning::Capacitor reported load errors — see app-cold.log artifact"
          fi
          # Warm start: what a person sees on every launch after the first.
          xcrun simctl terminate "$UDID" tools.obey.app
          sleep 3
          T1=$(date '+%Y-%m-%d %H:%M:%S')
          xcrun simctl launch "$UDID" tools.obey.app
          wait_for_paint warm 45 "$T1" || PAINTED=0
          sleep 1
          xcrun simctl io "$UDID" screenshot sim-output/02-home-warm.png
          {
            echo "### iOS Simulator launch"
            echo "- Cold start first paint: $(cat sim-output/cold-paint.txt 2>/dev/null || echo none)"
            echo "- Warm start first paint: $(cat sim-output/warm-paint.txt 2>/dev/null || echo none)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$PAINTED" = 1 ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-output
          path: |
            app/sim-output/
            app/build/sim.log
            app/build/device.log
          if-no-files-found: ignore
