name: Follow Daily Circles
on:
  pull_request:
    paths:
      - 'follow-circles.*'
      - 'daily-sos.html'
      - 'supabase/migrations/*follow*.sql'
      - 'scripts/test-follow-circles.mjs'
      - 'daily-sos-circles.*'
      - 'scripts/circles-*.sql'
      - 'scripts/test-following-together.mjs'
      - '.github/workflows/follow-circles.yml'
      - 'church.*'
      - 'conversation-box.html'
      - 'scripts/test-circle-conversations.mjs'
      - 'scripts/e2e/**'
  push:
    paths:
      - 'follow-circles.*'
      - 'daily-sos.html'
      - 'daily-sos-circles.*'
      - 'supabase/migrations/*follow*.sql'
      - 'scripts/circles-*.sql'
      - 'scripts/test-follow-circles.mjs'
      - 'scripts/test-following-together.mjs'
      - 'church.*'
      - 'conversation-box.html'
      - 'scripts/test-circle-conversations.mjs'
      - 'scripts/e2e/**'
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check follow-circles.js
      - run: node --check daily-sos-circles.js
      - run: node scripts/test-follow-circles.mjs
      - run: node scripts/test-following-together.mjs
      - run: node --check church.js
      - run: node scripts/test-circle-conversations.mjs
  database-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: circles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d circles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: testpassword
      PGDATABASE: circles_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated auth and SOS fixtures
        run: psql -v ON_ERROR_STOP=1 -f scripts/circles-test-bootstrap.sql
      - name: Apply migration on isolated PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261122120000_follow_multiplying_circles.sql
      - name: Exercise authenticated RLS and invitation contracts
        run: psql -v ON_ERROR_STOP=1 -f scripts/circles-rls-tests.sql
      - name: Apply shared Circle schedule migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261122190000_follow_circle_shared_schedules.sql
      - name: Exercise shared schedule and primary Circle contracts
        run: psql -v ON_ERROR_STOP=1 -f scripts/circles-shared-schedule-tests.sql
      - name: Apply Conversation Box and church migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261123090000_follow_circle_conversations.sql
      - name: Exercise Conversation Box sharing and church contracts
        run: psql -v ON_ERROR_STOP=1 -f scripts/circles-conversations-tests.sql
  browser-e2e:
    # Real pages, real migrations and RLS, through a test-only SQL bridge.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: circles_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d circles_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: testpassword
      PGDATABASE: circles_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node scripts/e2e/circle-conversations.e2e.mjs e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circle-conversations-e2e
          path: e2e-shots
