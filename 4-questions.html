<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background: #f2f2f7;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 0;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  /* ── Content card (no longer tappable) ── */
  .panel-inner {
    width: calc(100% - 32px);
    max-width: 520px;
    margin: 16px auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
  }
  .panel-inner + .panel-inner { margin-top: 16px; }
  .svg-wrap { width: 100%; max-width: 480px; }
  .svg-wrap svg { width: 100%; height: auto; display: block; }
  /* ── Labels ── */
  .label-top {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(16px, 4vw, 20px);
    letter-spacing: 0.18em;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .section-number {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 36px);
    letter-spacing: 0.1em;
    color: #aaa;
    margin-bottom: 10px;
  }
  .verse {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 38px);
    color: #111;
    margin-top: 10px;
  }
  /* ── When / Goals ── */
  .when-title {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: clamp(52px, 8vw, 68px);
    color: #111;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .goals-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    letter-spacing: 0.12em;
    color: #aaa;
    margin-bottom: 24px;
  }
  .goals-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .goal-item {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 34px);
    color: #111;
    letter-spacing: 0.06em;
    border-bottom: 2px solid #111;
    padding-bottom: 2px;
    min-width: 140px;
    text-align: center;
  }
  @media (max-width: 600px) {
    .panel-inner { padding: 32px 12px; }
    .svg-wrap { max-width: 100%; }
  }
  /* ── Auth section ── */
  .auth-section { width: calc(100% - 32px); max-width: 520px; padding: 12px 16px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin: 8px 16px 0; visibility: hidden; }
  .auth-section input { width: 100%; padding: 10px 14px; border: 1px solid #c6c6c8; border-radius: 8px; font-size: 15px; background: #fff; outline: none; margin-bottom: 8px; font-family: inherit; }
  .auth-section input:focus { border-color: #3a3a3c; }
  .auth-buttons { display: flex; gap: 8px; }
  .auth-buttons button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .auth-btn-primary { background: #3a3a3c; color: #fff; }
  .auth-btn-secondary { background: #e5e5ea; color: #3a3a3c; }
  .auth-status { display: flex; align-items: center; justify-content: space-between; }
  .auth-status-text { font-size: 13px; color: #8e8e93; }
  .auth-logout-btn { padding: 6px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #e5e5ea; color: #3a3a3c; font-family: inherit; }
  /* ── Page header ── */
  .page-header { width: calc(100% - 32px); max-width: 520px; margin: 12px 16px 0; padding: 20px 24px 16px; text-align: center; }
  .page-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(34px, 9vw, 52px); font-weight: 400; letter-spacing: 2px; color: #00D084; -webkit-text-stroke: 2px #000; line-height: 1; margin-bottom: 8px; }
  .page-header .subtitle { font-size: 14px; color: #8e8e93; line-height: 1.6; }
  .page-header .subtitle .green { color: #00D084; font-weight: 600; }
  /* ── Tab navigation ── */
  .tabs-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    background: #f2f2f7;
    padding: 8px 16px 10px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .tablist {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
  }
  .tab {
    flex: 1 1 0;
    min-width: 0;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(11px, 3.4vw, 16px);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #000;
    background: #fff;
    border: 2px solid #000;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .tab:hover { background: #f2f2f7; }
  .tab[aria-selected="true"] {
    background: #000;
    color: #fff;
    box-shadow: inset 0 -4px 0 #00D084;
  }
  .tab[aria-selected="true"]:hover { background: #000; }
  .tab:focus-visible {
    outline: 3px solid #00D084;
    outline-offset: 2px;
  }
  /* ── Tab panels ── */
  .tabpanel { width: 100%; }
  .tabpanel[hidden] { display: none; }
  .tabpanel:not([hidden]) { animation: fadeIn 0.3s ease; }
  /* ── Previous / Next nav ── */
  .panel-nav {
    width: calc(100% - 32px);
    max-width: 520px;
    margin: 20px auto 48px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .panel-nav.only-next { justify-content: flex-end; }
  .panel-nav.only-prev { justify-content: flex-start; }
  /* Section Prev/Next: understated inline text links, not pill buttons */
  .pn-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(14px, 3.6vw, 17px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    padding: 8px 4px;
    border: none;
    background: none;
    color: #3a3a3c;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color 0.15s ease, opacity 0.1s ease;
  }
  .pn-btn:hover { color: #000; }
  .pn-btn:active { opacity: 0.55; }
  .pn-btn:focus-visible {
    outline: 3px solid #00D084;
    outline-offset: 2px;
  }
  /* Previous / Next are a mobile convenience — on desktop the tab row is enough. */
  @media (min-width: 1024px) {
    .panel-nav { display: none; }
  }
  /* ── Presenter mode (desktop + mobile) ── */
  .present-btn { display: inline-block; }
  .present-btn {
    font-family: 'Bebas Neue', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 15px;
    padding: 8px 20px;
    border-radius: 50px;
    border: 2px solid #000;
    background: #00D084;
    color: #000;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .present-btn:hover { background: #000; color: #fff; }
  .present-btn:focus-visible { outline: 3px solid #00D084; outline-offset: 2px; }
  .present-ico { width: 0.8em; height: 0.8em; margin-right: 6px; vertical-align: -1px; }

  #presenter-ui[hidden] { display: none; }
  body.presenting { overflow: hidden; }
  /* Hide all normal chrome while presenting */
  body.presenting #home-bar,
  body.presenting .auth-section,
  body.presenting .page-header,
  body.presenting .tabs-wrap,
  body.presenting .panel-nav,
  body.presenting .acct-icon-btn,
  body.presenting .account-overlay { display: none !important; }
  /* The active panel becomes a full-screen stage */
  body.presenting .tabpanel:not([hidden]) {
    position: fixed; inset: 0; z-index: 200; margin: 0;
    background: #fff; animation: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8vh 5vw 12vh;
    touch-action: none;   /* we handle pan/zoom/swipe ourselves */
  }
  body.presenting .panel-inner {
    background: transparent; box-shadow: none; border-radius: 0;
    width: auto; max-width: 92vw; margin: 0; padding: 0;
  }
  body.presenting .panel-inner + .panel-inner { margin-top: 0; }
  /* Shrink the wrap to the diagram (overriding its inline max-width) so the
     centered flex column can center it; the SVG is sized by height. */
  body.presenting .svg-wrap { max-width: none !important; width: auto; display: flex; justify-content: center; }
  body.presenting .svg-wrap svg { height: 68vh; width: auto; max-width: 88vw; display: block; margin: 0 auto; }
  body.presenting #circles-img { max-height: 68vh !important; width: auto !important; max-width: 88vw !important; margin: 0 auto; }
  /* In-card section labels are redundant with the step heading — hide them */
  body.presenting .label-top,
  body.presenting .section-number { display: none; }
  /* Larger type for screen-share readability */
  body.presenting .verse { font-size: clamp(36px, 5vw, 64px); }
  body.presenting .when-title { font-size: clamp(64px, 10vw, 128px); }
  body.presenting .goals-label { font-size: clamp(24px, 3.5vw, 46px); }
  body.presenting .goal-item { font-size: clamp(40px, 6vw, 84px); min-width: 36vw; }
  /* How: show one tool at a time */
  body.presenting #panel-how[data-part="a"] [data-how="b"],
  body.presenting #panel-how[data-part="b"] [data-how="a"] { display: none; }
  /* Click-to-build layers */
  body.presenting [data-build] { visibility: hidden; }
  body.presenting [data-build].pz-on { visibility: visible; }
  /* Presenter chrome */
  #presenter-ui { position: fixed; inset: 0; z-index: 300; pointer-events: none; }
  #presenter-ui button { pointer-events: auto; }
  .pz-step {
    position: fixed; top: calc(20px + env(safe-area-inset-top)); left: calc(26px + env(safe-area-inset-left)); max-width: 60vw;
    font-family: 'Bebas Neue', sans-serif; text-transform: uppercase;
    letter-spacing: 0.06em; font-size: clamp(16px, 2vw, 26px); color: #000;
  }
  .pz-exit {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); right: calc(18px + env(safe-area-inset-right)); width: 44px; height: 44px;
    border-radius: 50%; border: 2px solid #000; background: #fff;
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .pz-controls {
    position: fixed; bottom: calc(22px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px;
  }
  .pz-btn {
    width: 56px; height: 56px; border-radius: 50%; border: 2px solid #000;
    background: #fff; color: #000; font-size: 26px; line-height: 1; cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
  }
  .pz-btn:hover { background: #00D084; }
  .pz-btn:disabled { opacity: 0.28; cursor: default; }
  .pz-count {
    font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.12em;
    font-size: 20px; min-width: 70px; text-align: center; color: #000;
  }
  .pz-btn:focus-visible, .pz-exit:focus-visible { outline: 3px solid #00D084; outline-offset: 2px; }
  /* Zoomable media (pinch / wheel) */
  body.presenting .svg-wrap svg,
  body.presenting #circles-img { touch-action: none; will-change: transform; }
  /* Rotate hint (portrait phones) */
  .pz-hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(94px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,0.9); color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px;
    padding: 9px 16px; border-radius: 50px; white-space: nowrap;
    pointer-events: auto; opacity: 0; transition: opacity 0.25s ease; display: none;
  }
  .pz-hint.show { display: block; opacity: 1; }
  /* ── Mobile / tablet presenter: size to width, fill the small viewport ── */
  @media (max-width: 1023px) {
    body.presenting .tabpanel:not([hidden]) {
      height: 100vh; height: 100dvh;
      padding: calc(9vh + env(safe-area-inset-top)) 4vw calc(13vh + env(safe-area-inset-bottom));
    }
    body.presenting .panel-inner { max-width: 96vw; }
    body.presenting .svg-wrap svg {
      height: auto; width: 94vw; max-width: 94vw; max-height: 74dvh;
    }
    body.presenting #circles-img {
      height: auto !important; width: 94vw !important; max-width: 94vw !important; max-height: 74dvh !important;
    }
    /* Slightly smaller presenter chrome so it never crowds the diagram */
    .pz-btn { width: 52px; height: 52px; font-size: 24px; }
    .pz-controls { gap: 14px; }
  }
  /* Landscape phone: viewport is short, so height is the limiting dimension —
     size the media by height (like desktop) and reserve room for the chrome. */
  @media (max-width: 1023px) and (orientation: landscape) {
    body.presenting .tabpanel:not([hidden]) {
      padding: calc(50px + env(safe-area-inset-top)) 5vw calc(78px + env(safe-area-inset-bottom));
    }
    body.presenting .svg-wrap svg {
      width: auto; height: 54dvh; max-height: 54dvh; max-width: 92vw;
    }
    body.presenting #circles-img {
      height: auto !important; width: auto !important; max-height: 56dvh !important; max-width: 84vw !important;
    }
    body.presenting .verse { font-size: clamp(20px, 3vh, 34px); margin-top: 4px; }
  }
</style>

      if (subtitle) subtitle.hidden = index !== 0;
      if (opts.focus !== false) tabs[index].focus({ preventScroll: true });
      if (opts.scroll) {
        // Anchor every tab to the very top of the page on switch.
        window.scrollTo({ top: 0, left: 0 });
      }
    }

    // Move keyboard focus between tabs without activating them (manual activation).
    function focusTab(index) {
      tabs.forEach(function (tab, i) { tab.tabIndex = i === index ? 0 : -1; });
      tabs[index].focus();
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener('click', function () {
        selectTab(i, { scroll: true, focus: false });
      });
    });

    var tablist = document.querySelector('[role="tablist"]');
    tablist.addEventListener('keydown', function (e) {
      var current = tabs.indexOf(document.activeElement);
      if (current < 0) return;
      var target = null;
      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown': target = (current + 1) % tabs.length; break;
        case 'ArrowLeft':
        case 'ArrowUp':   target = (current - 1 + tabs.length) % tabs.length; break;
        case 'Home':      target = 0; break;
        case 'End':       target = tabs.length - 1; break;
        case 'Enter':
        case ' ':
        case 'Spacebar':
          e.preventDefault();
          selectTab(current, { scroll: true });
          return;
        default: return;
      }
      e.preventDefault();
      focusTab(target);
    });

    // Previous / Next buttons within each panel.
    document.querySelectorAll('.pn-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var target = parseInt(btn.getAttribute('data-goto'), 10);
        selectTab(target, { scroll: true });
      });
    });

    window.addEventListener('DOMContentLoaded', function () {
      // Swap in the no-words 3 Circles image for non-English languages.
      var circlesImg = document.getElementById('circles-img');
      if (circlesImg && window.i18n && window.i18n.getLang() !== 'en') {
        circlesImg.src = 'assets/images/3 Circles Gospel Tool updated no words.webp';
      }
    });

    // Expose the tab activator so the presenter controller can drive slides.
    window.__ft = { selectTab: selectTab };
  })();
</script>
<!-- Presenter mode chrome (desktop) -->
<div id="presenter-ui" hidden>
  <div class="pz-step" id="pz-step" aria-live="polite"></div>
  <button class="pz-exit" id="pz-exit" type="button" aria-label="Exit presenter mode">✕</button>
  <div class="pz-hint" id="pz-hint">⤢ <span data-i18n="four_questions.rotate_hint">Rotate for a bigger view</span></div>
  <div class="pz-controls">
    <button class="pz-btn" id="pz-prev" type="button" aria-label="Previous">‹</button>
    <span class="pz-count" id="pz-count"></span>
    <button class="pz-btn" id="pz-next" type="button" aria-label="Next">›</button>
  </div>
</div>
<script>
  (function () {
    // Linear deck: How is split so each tool stands alone.
    var slides = [
      { tab: 0 },            // Intro
      { tab: 1 },            // Why
      { tab: 2 },            // Who
      { tab: 3, part: 'a' }, // How — 15 Second Story
      { tab: 3, part: 'b' }, // How — 3 Circles
      { tab: 4 }             // When
    ];
    var idx = 0, level = 0;
    var body = document.body;
    var howPanel = document.getElementById('panel-how');
    var ui = document.getElementById('presenter-ui');
    var stepEl = document.getElementById('pz-step');
    var countEl = document.getElementById('pz-count');
    var prevBtn = document.getElementById('pz-prev');
    var nextBtn = document.getElementById('pz-next');
    var presentBtn = document.getElementById('present-btn');
    var tabButtons = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));

    function activePanel() { return document.querySelector('.tabpanel:not([hidden])'); }

    // Build groups within the currently visible content of the active slide.
    function groups() {
      var panel = activePanel();
      var els = Array.prototype.slice.call(panel.querySelectorAll('[data-build]'));
      var part = slides[idx].part;
      if (part) els = els.filter(function (el) { return el.closest('[data-how="' + part + '"]'); });
      var seen = {};
      els.forEach(function (el) { seen[el.getAttribute('data-build')] = true; });
      var keys = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
      return { els: els, keys: keys };
    }
    function applyBuilds() {
      var g = groups();
      var reveal = {};
      for (var i = 0; i < level && i < g.keys.length; i++) reveal[g.keys[i]] = true;
      g.els.forEach(function (el) {
        if (reveal[+el.getAttribute('data-build')]) el.classList.add('pz-on');
        else el.classList.remove('pz-on');
      });
    }
    function maxLevel() { return groups().keys.length; }

    // ── Pinch / wheel zoom + pan on the current diagram ──
    var zoom = { scale: 1, tx: 0, ty: 0 };
    function zoomEl() {
      var p = activePanel(); if (!p) return null;
      var part = slides[idx].part;
      var scope = (part && p.querySelector('[data-how="' + part + '"]')) || p;
      return scope.querySelector('svg') || scope.querySelector('img');
    }
    function applyZoom() {
      var el = zoomEl(); if (!el) return;
      el.style.transformOrigin = 'center center';
      el.style.transform = 'translate(' + zoom.tx + 'px,' + zoom.ty + 'px) scale(' + zoom.scale + ')';
    }
    function resetZoom() {
      var el = zoomEl();
      if (el) el.style.transform = '';
      zoom.scale = 1; zoom.tx = 0; zoom.ty = 0;
    }

    function updateChrome() {
      countEl.textContent = (idx + 1) + ' / ' + slides.length;
      var label = tabButtons[slides[idx].tab].textContent.trim();
      var part = slides[idx].part;
      if (part) {
        var lbl = howPanel.querySelector('[data-how="' + part + '"] .label-top');
        if (lbl) label += ' — ' + lbl.textContent.trim();
      }
      stepEl.textContent = label;
      prevBtn.disabled = (idx === 0 && level === 0);
      nextBtn.disabled = (idx === slides.length - 1 && level >= maxLevel());
    }
    function show(i, lvl) {
      resetZoom();
      idx = Math.max(0, Math.min(slides.length - 1, i));
      var s = slides[idx];
      window.__ft.selectTab(s.tab, { focus: false, scroll: false });
      if (s.part) howPanel.setAttribute('data-part', s.part);
      else howPanel.removeAttribute('data-part');
      var mx = maxLevel();
      level = (lvl === 'max') ? mx : Math.max(0, Math.min(lvl || 0, mx));
      applyBuilds();
      updateChrome();
    }
    function next() {
      resetZoom();
      if (level < maxLevel()) { level++; applyBuilds(); updateChrome(); }
      else if (idx < slides.length - 1) { show(idx + 1, 0); }
    }
    function prev() {
      resetZoom();
      if (level > 0) { level--; applyBuilds(); updateChrome(); }
      else if (idx > 0) { show(idx - 1, 'max'); }
    }

    function currentTabIndex() {
      for (var i = 0; i < tabButtons.length; i++) {
        if (tabButtons[i].getAttribute('aria-selected') === 'true') return i;
      }
      return 0;
    }
    function enter() {
      body.classList.add('presenting');
      ui.hidden = false;
      var ct = currentTabIndex(), start = 0;
      for (var i = 0; i < slides.length; i++) { if (slides[i].tab === ct) { start = i; break; } }
      // Fullscreen where supported (desktop, Android); iOS Safari falls back to
      // the full-viewport overlay since it can't fullscreen arbitrary elements.
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
      show(start, 0);
      nextBtn.focus();
      requestWake();
      maybeRotateHint();
    }
    function exit() {
      if (!body.classList.contains('presenting')) return;
      body.classList.remove('presenting');
      ui.hidden = true;
      howPanel.removeAttribute('data-part');
      Array.prototype.slice.call(document.querySelectorAll('.pz-on'))
        .forEach(function (el) { el.classList.remove('pz-on'); });
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      releaseWake();
      presentBtn.focus();
    }

    presentBtn.addEventListener('click', function (e) { e.stopPropagation(); enter(); });
    document.getElementById('pz-exit').addEventListener('click', exit);
    prevBtn.addEventListener('click', function (e) { e.stopPropagation(); prev(); });
    nextBtn.addEventListener('click', function (e) { e.stopPropagation(); next(); });

    // Tap/click the stage to advance (reveal next layer, then next slide).
    // On touch-sized screens the left third goes back, like an e-reader.
    var suppressTap = false;
    document.addEventListener('click', function (e) {
      if (!body.classList.contains('presenting')) return;
      if (e.target.closest('#presenter-ui')) return;
      if (suppressTap) { suppressTap = false; return; }
      if (window.innerWidth < 1024 && e.clientX < window.innerWidth * 0.30) prev();
      else next();
    });

    document.addEventListener('keydown', function (e) {
      if (!body.classList.contains('presenting')) return;
      switch (e.key) {
        case 'ArrowRight': case 'PageDown': case ' ': case 'Spacebar':
          e.preventDefault(); next(); break;
        case 'ArrowLeft': case 'PageUp':
          e.preventDefault(); prev(); break;
        case 'Home': e.preventDefault(); show(0, 0); break;
        case 'End': e.preventDefault(); show(slides.length - 1, 'max'); break;
        case 'Escape': e.preventDefault(); exit(); break;
      }
    });

    // Leaving fullscreen (Esc / browser UI) exits presenter mode.
    document.addEventListener('fullscreenchange', function () {
      if (!document.fullscreenElement) exit();
    });

    // Touch gestures: 2 fingers = pinch-zoom; 1 finger = pan (when zoomed) or
    // swipe/tap (at 1x). Swipe left/right changes slides; swipe down exits.
    var gStart = { x: 0, y: 0 }, gMode = null;
    var gStartDist = 0, gStartScale = 1, gStartTx = 0, gStartTy = 0;
    function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

    document.addEventListener('touchstart', function (e) {
      if (!body.classList.contains('presenting')) return;
      if (e.target.closest('#presenter-ui')) return;
      suppressTap = false;
      if (e.touches.length === 2) {
        gMode = 'pinch'; gStartDist = dist(e.touches[0], e.touches[1]); gStartScale = zoom.scale;
      } else {
        var t = e.changedTouches[0]; gStart.x = t.clientX; gStart.y = t.clientY;
        if (zoom.scale > 1) { gMode = 'pan'; gStartTx = zoom.tx; gStartTy = zoom.ty; }
        else { gMode = 'tap'; }
      }
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      if (!body.classList.contains('presenting')) return;
      if (gMode === 'pinch' && e.touches.length >= 2) {
        zoom.scale = Math.min(4, Math.max(1, gStartScale * (dist(e.touches[0], e.touches[1]) / gStartDist)));
        applyZoom(); e.preventDefault();
      } else if (gMode === 'pan' && e.touches.length === 1) {
        var t = e.touches[0];
        zoom.tx = gStartTx + (t.clientX - gStart.x);
        zoom.ty = gStartTy + (t.clientY - gStart.y);
        applyZoom(); e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('touchend', function (e) {
      if (!body.classList.contains('presenting')) return;
      if (e.target.closest('#presenter-ui')) return;
      if (gMode === 'pinch') { if (zoom.scale <= 1.03) resetZoom(); gMode = null; suppressTap = true; return; }
      if (gMode === 'pan') { gMode = null; suppressTap = true; return; }
      gMode = null;
      var t = e.changedTouches[0];
      var dx = t.clientX - gStart.x, dy = t.clientY - gStart.y, ax = Math.abs(dx), ay = Math.abs(dy);
      if (ax < 30 && ay < 30) return;   // a tap — let the click handler act
      suppressTap = true;               // a gesture — don't also advance on the click
      if (ax > ay && ax > 50) {
        if (dx < 0) { if (idx < slides.length - 1) show(idx + 1, 0); }
        else { if (idx > 0) show(idx - 1, 'max'); }
      } else if (ay > ax && dy > 90) {
        exit();
      }
    }, { passive: true });

    // Desktop: wheel to zoom, drag to pan when zoomed.
    document.addEventListener('wheel', function (e) {
      if (!body.classList.contains('presenting')) return;
      if (e.target.closest('#presenter-ui') || !zoomEl()) return;
      e.preventDefault();
      zoom.scale = Math.min(4, Math.max(1, zoom.scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
      if (zoom.scale === 1) { zoom.tx = 0; zoom.ty = 0; }
      applyZoom();
    }, { passive: false });
    var mDrag = false, mdx = 0, mdy = 0, mtx = 0, mty = 0;
    document.addEventListener('mousedown', function (e) {
      if (!body.classList.contains('presenting')) return;
      if (e.target.closest('#presenter-ui') || zoom.scale <= 1) return;
      mDrag = true; mdx = e.clientX; mdy = e.clientY; mtx = zoom.tx; mty = zoom.ty;
    });
    document.addEventListener('mousemove', function (e) {
      if (!mDrag) return;
      zoom.tx = mtx + (e.clientX - mdx); zoom.ty = mty + (e.clientY - mdy); applyZoom();
    });
    document.addEventListener('mouseup', function () { if (mDrag) { mDrag = false; suppressTap = true; } });

    // Keep the screen awake while presenting (mobile teaching sessions).
    var wakeLock = null;
    function requestWake() {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function (w) { wakeLock = w; }).catch(function () {});
      }
    }
    function releaseWake() {
      if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && body.classList.contains('presenting')) requestWake();
    });

    // One-time "rotate for a bigger view" nudge on portrait phones.
    var hintShown = false;
    var hintEl = document.getElementById('pz-hint');
    function maybeRotateHint() {
      if (hintShown || !hintEl) return;
      if (window.innerWidth < 768 && window.innerHeight > window.innerWidth) {
        hintShown = true;
        hintEl.classList.add('show');
        setTimeout(function () { hintEl.classList.remove('show'); }, 3500);
      }
    }
    hintEl.addEventListener('click', function (e) { e.stopPropagation(); hintEl.classList.remove('show'); });
  })();
</script>
