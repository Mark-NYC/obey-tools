<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background: #f2f2f7;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0 0;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  /* ── Content card (no longer tappable) ── */
  .panel-inner {
    width: calc(100% - 32px);
    max-width: 520px;
    margin: 16px auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
  }
  .panel-inner + .panel-inner { margin-top: 16px; }
  .svg-wrap { width: 100%; max-width: 480px; }
  .svg-wrap svg { width: 100%; height: auto; display: block; }
  /* ── Labels ── */
  .label-top {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(16px, 4vw, 20px);
    letter-spacing: 0.18em;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .section-number {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 36px);
    letter-spacing: 0.1em;
    color: #aaa;
    margin-bottom: 10px;
  }
  .verse {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: clamp(28px, 7vw, 38px);
    color: #111;
    margin-top: 10px;
  }
  /* ── When / Goals ── */
  .when-title {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: clamp(52px, 8vw, 68px);
    color: #111;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .goals-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(18px, 4vw, 24px);
    letter-spacing: 0.12em;
    color: #aaa;
    margin-bottom: 24px;
  }
  .goals-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .goal-item {
    font-family: 'Amatic SC', cursive;
    font-weight: 700;
    font-size: clamp(24px, 6vw, 34px);
    color: #111;
    letter-spacing: 0.06em;
    border-bottom: 2px solid #111;
    padding-bottom: 2px;
    min-width: 140px;
    text-align: center;
  }
  @media (max-width: 600px) {
    .panel-inner { padding: 32px 12px; }
    .svg-wrap { max-width: 100%; }
  }
  /* ── Auth section ── */
  .auth-section { width: calc(100% - 32px); max-width: 520px; padding: 12px 16px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin: 8px 16px 0; visibility: hidden; }
  .auth-section input { width: 100%; padding: 10px 14px; border: 1px solid #c6c6c8; border-radius: 8px; font-size: 15px; background: #fff; outline: none; margin-bottom: 8px; font-family: inherit; }
  .auth-section input:focus { border-color: #3a3a3c; }
  .auth-buttons { display: flex; gap: 8px; }
  .auth-buttons button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .auth-btn-primary { background: #3a3a3c; color: #fff; }
  .auth-btn-secondary { background: #e5e5ea; color: #3a3a3c; }
  .auth-status { display: flex; align-items: center; justify-content: space-between; }
  .auth-status-text { font-size: 13px; color: #8e8e93; }
  .auth-logout-btn { padding: 6px 14px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: #e5e5ea; color: #3a3a3c; font-family: inherit; }
  /* ── Page header ── */
  .page-header { width: calc(100% - 32px); max-width: 520px; margin: 12px 16px 0; padding: 20px 24px 16px; text-align: center; }
  .page-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 52px; font-weight: 400; letter-spacing: 2px; color: #00D084; -webkit-text-stroke: 2px #000; line-height: 1; margin-bottom: 8px; }
  .page-header .subtitle { font-size: 14px; color: #8e8e93; line-height: 1.6; }
  .page-header .subtitle .green { color: #00D084; font-weight: 600; }
  /* ── Tab navigation ── */
  .tabs-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    background: #f2f2f7;
    padding: 8px 16px 10px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  }
  .tablist {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
  }
  .tab {
    flex: 1 1 0;
    min-width: 0;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px 4px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(11px, 3.4vw, 16px);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #000;
    background: #fff;
    border: 2px solid #000;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  }
  .tab:hover { background: #f2f2f7; }
  .tab[aria-selected="true"] {
    background: #000;
    color: #fff;
    box-shadow: inset 0 -4px 0 #00D084;
  }
  .tab[aria-selected="true"]:hover { background: #000; }
  .tab:focus-visible {
    outline: 3px solid #00D084;
    outline-offset: 2px;
  }
  /* ── Tab panels ── */
  .tabpanel { width: 100%; }
  .tabpanel[hidden] { display: none; }
  .tabpanel:not([hidden]) { animation: fadeIn 0.3s ease; }
  .tabpanel { scroll-margin-top: var(--tabs-h, 64px); }
  /* ── Previous / Next nav ── */
  .panel-nav {
    width: calc(100% - 32px);
    max-width: 520px;
    margin: 20px auto 48px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .panel-nav.only-next { justify-content: flex-end; }
  .panel-nav.only-prev { justify-content: flex-start; }
  .pn-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(14px, 3.6vw, 17px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    min-height: 44px;
    padding: 12px 22px;
    border-radius: 50px;
    border: 2px solid #000;
    background: #fff;
    color: #000;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .pn-next { background: #000; color: #fff; }
  .pn-prev:hover { background: #f2f2f7; }
  .pn-next:hover { background: #00D084; border-color: #00D084; color: #000; }
  .pn-btn:active { transform: scale(0.97); }
  .pn-btn:focus-visible {
    outline: 3px solid #00D084;
    outline-offset: 2px;
  }
</style>

<script>
  (function () {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
    var panels = tabs.map(function (t) { return document.getElementById(t.getAttribute('aria-controls')); });

    // Keep the panels' scroll-margin in sync with the sticky tab row height.
    function updateTabsHeight() {
      var wrap = document.querySelector('.tabs-wrap');
      if (wrap) {
        document.documentElement.style.setProperty('--tabs-h', (wrap.offsetHeight + 8) + 'px');
      }
    }

    // Select a tab: update ARIA state, show its panel, hide the rest.
    function selectTab(index, opts) {
      opts = opts || {};
      if (index < 0 || index >= tabs.length) return;
      tabs.forEach(function (tab, i) {
        var selected = i === index;
        tab.setAttribute('aria-selected', selected ? 'true' : 'false');
        tab.tabIndex = selected ? 0 : -1;
        panels[i].hidden = !selected;
      });
      if (opts.focus !== false) tabs[index].focus({ preventScroll: true });
      if (opts.scroll) {
        // Position the top of the new panel just below the sticky tab row.
        window.requestAnimationFrame(function () {
          panels[index].scrollIntoView({ block: 'start' });
        });
      }
    }

    // Move keyboard focus between tabs without activating them (manual activation).
    function focusTab(index) {
      tabs.forEach(function (tab, i) { tab.tabIndex = i === index ? 0 : -1; });
      tabs[index].focus();
    }

    tabs.forEach(function (tab, i) {
      tab.addEventListener('click', function () {
        selectTab(i, { scroll: true, focus: false });
      });
    });

    var tablist = document.querySelector('[role="tablist"]');
    tablist.addEventListener('keydown', function (e) {
      var current = tabs.indexOf(document.activeElement);
      if (current < 0) return;
      var target = null;
      switch (e.key) {
        case 'ArrowRight':
        case 'ArrowDown': target = (current + 1) % tabs.length; break;
        case 'ArrowLeft':
        case 'ArrowUp':   target = (current - 1 + tabs.length) % tabs.length; break;
        case 'Home':      target = 0; break;
        case 'End':       target = tabs.length - 1; break;
        case 'Enter':
        case ' ':
        case 'Spacebar':
          e.preventDefault();
          selectTab(current, { scroll: true });
          return;
        default: return;
      }
      e.preventDefault();
      focusTab(target);
    });

    // Previous / Next buttons within each panel.
    document.querySelectorAll('.pn-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var target = parseInt(btn.getAttribute('data-goto'), 10);
        selectTab(target, { scroll: true });
      });
    });

    window.addEventListener('resize', updateTabsHeight);
    window.addEventListener('load', updateTabsHeight);

    window.addEventListener('DOMContentLoaded', function () {
      updateTabsHeight();
      // Recompute once fonts/translations settle (tab row height can change).
      window.addEventListener('i18n:ready', updateTabsHeight, { once: true });
      // Swap in the no-words 3 Circles image for non-English languages.
      var circlesImg = document.getElementById('circles-img');
      if (circlesImg && window.i18n && window.i18n.getLang() !== 'en') {
        circlesImg.src = 'assets/images/3 Circles Gospel Tool updated no words.webp';
      }
    });
  })();
</script>
