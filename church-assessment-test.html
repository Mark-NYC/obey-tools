<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="assets/images/favicons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Obey Tools">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="/assets/fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/buttons.css">
    <title>Church Circle (Test)</title>
</head>
<body>

<div id="top-home" style="text-align:center; padding:20px 0 8px;">
    <a href="index.html" style="display:inline-block; background:#000; color:#fff; font-weight:700; font-size:17px; padding:12px 28px; border-radius:50px; text-decoration:none;">Home</a>
</div>

<div class="container">
    <div id="page-header" style="text-align:center; padding:26px 16px 4px; background:#fff;">
        <div style="font-family:'Bebas Neue', cursive; font-size:52px; font-weight:400; letter-spacing:2px; color:#000; line-height:1;">Church Circle</div>
        <div style="font-size:14px; color:#8e8e93; margin-top:4px;">Acts 2:36&ndash;47 &mdash; the first church.</div>
    </div>

    <!-- ============================= LANDING ============================= -->
    <div id="landing-view">
        <div class="assessment-container">
            <div class="church-circle solid" id="landing-circle">
                <div class="vertical-line left"></div>
                <div class="vertical-line center"></div>
                <div class="vertical-line right"></div>
                <div class="horizontal-line top"></div>
                <div class="horizontal-line bottom"></div>
                <div class="icon-grid">
                    <div class="icon-cell bg-none"><img src="assets/images/icons/gospel-icon.webp" alt="The Gospel"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/repent-icon.webp" alt="Repent & Believe"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/baptism-icon.webp" alt="Baptism"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/holy-spirit-icon.webp" alt="Holy Spirit"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/word-icon.webp" alt="The Word"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/love-icon.webp" alt="Love"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/lords-supper-icon.webp" alt="Lord's Supper"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/pray-icon.webp" alt="Prayer"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/signs-and-wonders-icon.webp" alt="Signs & Wonders"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/give-icon.webp" alt="Giving"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/worship-icon.webp" alt="Worship"></div>
                    <div class="icon-cell bg-none"><img src="assets/images/icons/go-make-disciples-icon.webp" alt="Make Disciples"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="btn btn-accent" onclick="startPresentation()">PRESENT</button>
                <a class="btn btn-primary" href="church-assessment.html" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">ASSESS HEALTH</a>
            </div>
        </div>

        <div class="landing-hint">
            <p><b>Present</b> &mdash; walk through Acts 2:36&ndash;47 and watch each practice added to the church circle.</p>
            <p><b>Assess Health</b> &mdash; evaluate the health of a church you lead.</p>
        </div>
    </div>

    <!-- ========================== PRESENTATION ========================== -->
    <div id="presentation-view" style="display:none;">
        <div class="present-topbar">
            <div class="present-count" id="present-count">1 / 12</div>
            <div class="present-ref" id="present-ref">Acts 2:36</div>
            <button class="ot-exit" onclick="exitPresentation()" aria-label="Exit presentation">&times;</button>
        </div>

        <div class="present-progress"><div class="present-progress-fill" id="present-progress-fill"></div></div>

        <div class="assessment-container" style="min-height:auto; padding-top:16px; padding-bottom:8px;">
            <div class="church-circle solid" id="present-circle">
                <div class="vertical-line left"></div>
                <div class="vertical-line center"></div>
                <div class="vertical-line right"></div>
                <div class="horizontal-line top"></div>
                <div class="horizontal-line bottom"></div>
                <div class="icon-grid" id="present-grid">
                    <div class="icon-cell dim"><img src="assets/images/icons/gospel-icon.webp" alt="The Gospel"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/repent-icon.webp" alt="Repent & Believe"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/baptism-icon.webp" alt="Baptism"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/holy-spirit-icon.webp" alt="Holy Spirit"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/word-icon.webp" alt="The Word"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/love-icon.webp" alt="Love"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/lords-supper-icon.webp" alt="Lord's Supper"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/pray-icon.webp" alt="Prayer"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/signs-and-wonders-icon.webp" alt="Signs & Wonders"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/give-icon.webp" alt="Giving"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/worship-icon.webp" alt="Worship"></div>
                    <div class="icon-cell dim"><img src="assets/images/icons/go-make-disciples-icon.webp" alt="Make Disciples"></div>
                </div>
            </div>
        </div>

        <div class="verse-card">
            <div class="verse-practice" id="verse-practice"></div>
            <p class="verse-text" id="verse-text"></p>
        </div>

        <div class="present-controls">
            <button class="present-nav" id="btn-back" onclick="prevStep()">&larr; Back</button>
            <button class="present-play" id="btn-play" onclick="togglePlay()">&#9654; Play</button>
            <button class="present-nav" id="btn-next" onclick="nextStep()">Next &rarr;</button>
        </div>
        <div class="present-restart-row">
            <button class="present-restart" onclick="restartPresentation()">&#8635; Start over</button>
        </div>
    </div>
</div>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; background: #f2f2f7; min-height: 100vh; color: #000; line-height: 1.4; }
.container { max-width: 430px; margin: 0 auto; background: #fff; min-height: 100vh; }

.controls { padding: 0 16px 20px; background: #fff; }
.btn-group { display: flex; gap: 8px; }
.btn { flex: 1; padding: 14px 16px; border: none; border-radius: var(--ot-radius); font-weight: 700; font-size: 15px; letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s ease; }
.btn-primary { background: var(--ot-primary); color: var(--ot-primary-ink); }
.btn-primary:active { background: var(--ot-primary-press); transform: scale(0.98); }
.btn-accent { background: var(--ot-accent); color: var(--ot-accent-ink); }
.btn-accent:active { background: var(--ot-accent-press); transform: scale(0.98); }
.btn-secondary { background: var(--ot-secondary); color: var(--ot-secondary-ink); }
.btn-secondary:active { background: var(--ot-secondary-press); transform: scale(0.98); }

.assessment-container { padding: 20px 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 50vh; gap: 20px; }
.church-circle { position: relative; width: 320px; height: 320px; border: 4px solid #333; border-radius: 50%; background-color: white; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.church-circle.dotted { border-style: dashed; }
.church-circle.solid { border-style: solid; }
.icon-grid { position: absolute; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); padding: 20px; box-sizing: border-box; }
.icon-cell { display: flex; justify-content: center; align-items: center; position: relative; width: 100%; height: 100%; }
.icon-cell img { width: 60px; height: 60px; object-fit: contain; z-index: 20; border-radius: 8px; transition: transform 0.35s ease, opacity 0.35s ease; }
.icon-cell::before { content: ''; position: absolute; width: 60px; height: 60px; border-radius: 50%; z-index: 15; background-color: transparent; transition: all 0.35s ease; }
.icon-grid > .icon-cell:nth-child(-n+4) img, .icon-grid > .icon-cell:nth-child(-n+4)::before { transform: translateY(8px); }
.icon-grid > .icon-cell:nth-child(9) img, .icon-grid > .icon-cell:nth-child(9)::before { transform: translateY(-8px); }
.icon-grid > .icon-cell:nth-child(12) img, .icon-grid > .icon-cell:nth-child(12)::before { transform: translateY(-8px); }
.icon-grid > .icon-cell:nth-child(5) img, .icon-grid > .icon-cell:nth-child(5)::before { transform: translateX(-8px); }
.bg-none::before { background-color: transparent; }
.bg-green::before { background-color: var(--ot-status-healthy, #00D084); }
.bg-yellow::before { background-color: var(--ot-status-partial, #FCB900); }
.bg-red::before { background-color: var(--ot-status-none, #FF745B); }

/* Presentation icon states — gray (pending) to black (revealed). No color fills. */
.icon-cell.dim img { opacity: 0.28; transition: opacity 0.45s ease, transform 0.45s ease; }
.icon-cell.revealed img { opacity: 1; }
.icon-cell.just-revealed img { animation: pop 0.55s ease; }
@keyframes pop { 0% { transform: scale(0.6); } 55% { transform: scale(1.15); } 100% { transform: scale(1); } }
/* Keep the nudge transforms working alongside the pop animation */
.icon-grid > .icon-cell.just-revealed:nth-child(-n+4) img { animation: pop-down 0.55s ease; }
.icon-grid > .icon-cell.just-revealed:nth-child(9) img,
.icon-grid > .icon-cell.just-revealed:nth-child(12) img { animation: pop-up 0.55s ease; }
.icon-grid > .icon-cell.just-revealed:nth-child(5) img { animation: pop-left 0.55s ease; }
@keyframes pop-down { 0% { transform: translateY(8px) scale(0.6); } 55% { transform: translateY(8px) scale(1.15); } 100% { transform: translateY(8px) scale(1); } }
@keyframes pop-up { 0% { transform: translateY(-8px) scale(0.6); } 55% { transform: translateY(-8px) scale(1.15); } 100% { transform: translateY(-8px) scale(1); } }
@keyframes pop-left { 0% { transform: translateX(-8px) scale(0.6); } 55% { transform: translateX(-8px) scale(1.15); } 100% { transform: translateX(-8px) scale(1); } }

.vertical-line { position: absolute; width: 3px; background-color: #333; top: 0; bottom: 0; z-index: 10; }
.horizontal-line { position: absolute; height: 3px; background-color: #333; left: 0; right: 0; z-index: 10; }
.vertical-line.left { left: calc(25% - 1.5px); }
.vertical-line.center { left: calc(50% - 1.5px); }
.vertical-line.right { left: calc(75% - 1.5px); }
.horizontal-line.top { top: calc(33.33% - 1.5px); }
.horizontal-line.bottom { top: calc(66.66% - 1.5px); }

.landing-hint { padding: 4px 24px 28px; background: #fff; color: #6b6b70; font-size: 14px; }
.landing-hint p { margin-bottom: 8px; }
.landing-hint b { color: #1c1c1e; }

/* ---- Presentation chrome ---- */
.present-topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #fff; border-bottom: 0.5px solid #e2e2e6; }
.present-ref { font-family: 'Bebas Neue', cursive; font-size: 24px; letter-spacing: 1px; color: #000; }
.present-count { font-size: 13px; color: #8e8e93; font-variant-numeric: tabular-nums; min-width: 44px; text-align: left; }
.present-progress { height: 4px; background: #ededf0; }
.present-progress-fill { height: 100%; width: 0%; background: var(--ot-primary, #3A3A3C); transition: width 0.35s ease; }

.verse-card { margin: 4px 16px 16px; padding: 18px 18px 20px; background: #f7f7fa; border-radius: 14px; min-height: 140px; }
.verse-practice { font-size: 12px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: #8a6d00; margin-bottom: 11px; }
.verse-text { font-size: 16px; line-height: 1.7; color: #1c1c1e; }
/* Highlighter marker over the matching phrase; swipes in left-to-right, wraps cleanly */
.verse-text .hl {
    background-image: linear-gradient(#ffe27a, #ffe27a);
    background-repeat: no-repeat;
    background-position: 0 88%;
    background-size: 100% 58%;
    padding: 0 2px;
    color: #1c1c1e;
    font-weight: 700;
    border-radius: 2px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
    animation: hl-in 0.5s ease 0.12s both;
}
@keyframes hl-in { from { background-size: 0% 58%; } to { background-size: 100% 58%; } }
@media (prefers-reduced-motion: reduce) { .verse-text .hl { animation: none; } .icon-cell.just-revealed img { animation: none; } }

.present-controls { display: flex; gap: 8px; padding: 0 16px; }
.present-nav, .present-play { flex: 1; padding: 13px 12px; border: none; border-radius: var(--ot-radius); font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.15s ease; }
.present-nav { background: var(--ot-secondary); color: var(--ot-secondary-ink); }
.present-nav:active { background: var(--ot-secondary-press); transform: scale(0.98); }
.present-nav:disabled { opacity: 0.4; cursor: default; }
.present-play { background: var(--ot-primary); color: var(--ot-primary-ink); flex: 1.3; }
.present-play:active { background: var(--ot-primary-press); transform: scale(0.98); }
.present-restart-row { display: flex; justify-content: center; padding: 14px 16px 4px; }
.present-restart { background: none; border: none; color: #8e8e93; font-size: 14px; font-weight: 600; cursor: pointer; }
.present-attribution { text-align: center; font-size: 11px; color: #b0b0b5; padding: 10px 24px 28px; }

/* ---- Focus mode: presentation fills the screen, no page scroll ---- */
#presentation-view { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
#presentation-view .present-topbar,
#presentation-view .present-progress,
#presentation-view .verse-card,
#presentation-view .present-controls,
#presentation-view .present-restart-row { flex-shrink: 0; }
/* Circle area takes the slack; the circle is a fixed square sized from the
   viewport (deterministic — no percentage-height, which iOS Safari collapses) */
#presentation-view .assessment-container { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 16px; }
#presentation-view .church-circle {
    width: min(86vw, calc(100dvh - 366px));
    height: min(86vw, calc(100dvh - 366px));
    min-width: 190px; min-height: 190px;
    max-width: 100%;
    box-shadow: none;
}
/* Icons sized relative to their cell so they scale with the circle */
#presentation-view .icon-cell img { width: 72%; height: 72%; }
#presentation-view .verse-card { margin: 4px 16px 12px; min-height: 0; }
#presentation-view .present-restart-row { padding: 10px 16px calc(8px + env(safe-area-inset-bottom)); }

@media (min-width: 768px) {
    .container { max-width: 768px; border-radius: 12px; margin: 20px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
    .church-circle { width: 400px; height: 400px; }
    .icon-cell img { width: 70px; height: 70px; }
    .icon-cell::before { width: 70px; height: 70px; }
    /* keep the fit-to-screen circle from ballooning on wide screens */
    #presentation-view .church-circle { width: 400px; height: 400px; max-height: 400px; }
    #presentation-view .icon-cell img { width: 70px; height: 70px; }
}
</style>

<script>
// ----- Icon labels (grid order) -----
const ICON_LABELS = [
    'The Gospel', 'Repent & Believe', 'Baptism', 'Holy Spirit',
    'The Word', 'Love', "Lord's Supper", 'Prayer',
    'Signs & Wonders', 'Giving', 'Worship', 'Make Disciples'
];

// ----- Presentation steps: one PRACTICE (icon) per step, in Acts 2 order. -----
// `icon` = grid index (0-based). `highlight` is the exact phrase in `text` to
// mark, so each practice ties to where it appears in Acts 2:36-47 (WEB, public domain).
const STEPS = [
    { icon: 0,  ref: 'Acts 2:36',    text: '"Let all the house of Israel therefore know certainly that God has made him both Lord and Christ, this Jesus whom you crucified."', highlight: 'God has made him both Lord and Christ' },
    { icon: 1,  ref: 'Acts 2:38',    text: 'Peter said to them, "Repent, and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of sins, and you will receive the gift of the Holy Spirit."', highlight: 'Repent' },
    { icon: 2,  ref: 'Acts 2:38',    text: 'Peter said to them, "Repent, and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of sins, and you will receive the gift of the Holy Spirit."', highlight: 'be baptized, every one of you, in the name of Jesus Christ' },
    { icon: 3,  ref: 'Acts 2:38',    text: 'Peter said to them, "Repent, and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of sins, and you will receive the gift of the Holy Spirit."', highlight: 'you will receive the gift of the Holy Spirit' },
    { icon: 4,  ref: 'Acts 2:42',    text: "They continued steadfastly in the apostles' teaching and fellowship, in the breaking of bread, and prayer.", highlight: "the apostles' teaching" },
    { icon: 5,  ref: 'Acts 2:42',    text: "They continued steadfastly in the apostles' teaching and fellowship, in the breaking of bread, and prayer.", highlight: 'fellowship' },
    { icon: 6,  ref: 'Acts 2:42',    text: "They continued steadfastly in the apostles' teaching and fellowship, in the breaking of bread, and prayer.", highlight: 'the breaking of bread' },
    { icon: 7,  ref: 'Acts 2:42',    text: "They continued steadfastly in the apostles' teaching and fellowship, in the breaking of bread, and prayer.", highlight: 'prayer' },
    { icon: 8,  ref: 'Acts 2:43',    text: 'Fear came on every soul, and many wonders and signs were done through the apostles.', highlight: 'many wonders and signs' },
    { icon: 9,  ref: 'Acts 2:45',    text: 'They sold their possessions and goods, and distributed them to all, according as anyone had need.', highlight: 'sold their possessions and goods, and distributed them to all' },
    { icon: 10, ref: 'Acts 2:46-47', text: 'They took their food with gladness and singleness of heart, praising God, and having favor with all the people.', highlight: 'praising God' },
    { icon: 11, ref: 'Acts 2:47',    text: 'And the Lord added to their number day by day those who were being saved.', highlight: 'the Lord added to their number day by day those who were being saved' }
];

let stepIndex = 0;
let isPlaying = false;
let playTimer = null;
const PLAY_INTERVAL = 4500;

function startPresentation() {
    document.getElementById('top-home').style.display = 'none';
    document.getElementById('page-header').style.display = 'none';
    document.getElementById('landing-view').style.display = 'none';
    document.getElementById('presentation-view').style.display = 'flex';
    stepIndex = 0;
    renderStep(true);
    window.scrollTo({ top: 0, behavior: 'auto' });
}

function exitPresentation() {
    stopPlay();
    document.getElementById('presentation-view').style.display = 'none';
    document.getElementById('top-home').style.display = '';
    document.getElementById('page-header').style.display = '';
    document.getElementById('landing-view').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartPresentation() {
    stopPlay();
    stepIndex = 0;
    renderStep(true);
}

// Render the verse text with the current practice's phrase wrapped in a highlighter.
function renderVerse(step) {
    const el = document.getElementById('verse-text');
    el.innerHTML = '';
    const t = step.text, h = step.highlight;
    const i = h ? t.indexOf(h) : -1;
    if (i < 0) { el.textContent = t; return; }
    el.appendChild(document.createTextNode(t.slice(0, i)));
    const mark = document.createElement('mark');
    mark.className = 'hl';
    mark.textContent = h;
    el.appendChild(mark);
    el.appendChild(document.createTextNode(t.slice(i + h.length)));
}

function renderStep(animateAll) {
    const step = STEPS[stepIndex];
    document.getElementById('present-ref').textContent = step.ref;
    document.getElementById('present-count').textContent = (stepIndex + 1) + ' / ' + STEPS.length;
    document.getElementById('present-progress-fill').style.width = ((stepIndex + 1) / STEPS.length * 100) + '%';
    document.getElementById('verse-practice').textContent = ICON_LABELS[step.icon];
    renderVerse(step);

    // One practice per step, in Acts 2 order: icons 0..stepIndex are black, the rest gray.
    const cells = document.querySelectorAll('#present-grid .icon-cell');
    cells.forEach((cell, idx) => {
        cell.classList.remove('just-revealed');
        if (idx <= stepIndex) {
            cell.classList.add('revealed');
            cell.classList.remove('dim');
            // Pop only the icon added on this exact step (the current practice).
            if (idx === stepIndex && !animateAll) {
                void cell.offsetWidth; // reflow so the animation restarts
                cell.classList.add('just-revealed');
            }
        } else {
            cell.classList.remove('revealed');
            cell.classList.add('dim');
        }
    });

    document.getElementById('btn-back').disabled = (stepIndex === 0);
    document.getElementById('btn-next').disabled = (stepIndex === STEPS.length - 1);
}

function nextStep() {
    if (stepIndex < STEPS.length - 1) {
        stepIndex++;
        renderStep(false);
    } else {
        stopPlay();
    }
}

function prevStep() {
    if (stepIndex > 0) {
        stepIndex--;
        renderStep(true);
    }
}

function togglePlay() {
    isPlaying ? stopPlay() : startPlay();
}

function startPlay() {
    isPlaying = true;
    document.getElementById('btn-play').innerHTML = '&#10073;&#10073; Pause';
    if (stepIndex === STEPS.length - 1) { stepIndex = 0; renderStep(true); }
    playTimer = setInterval(() => {
        if (stepIndex < STEPS.length - 1) {
            nextStep();
        } else {
            stopPlay();
        }
    }, PLAY_INTERVAL);
}

function stopPlay() {
    isPlaying = false;
    document.getElementById('btn-play').innerHTML = '&#9654; Play';
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

// Keyboard navigation for desktop presenting
document.addEventListener('keydown', (e) => {
    if (document.getElementById('presentation-view').style.display === 'none') return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextStep(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
    else if (e.key === 'Escape') { exitPresentation(); }
});
</script>

</body>
</html>
